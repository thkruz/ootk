# pnpm settings for the ootk repo.
#
# This file also anchors the pnpm workspace root. ootk is consumed as a git
# submodule at keeptrack-space/src/engine/ootk, and pnpm resolves its root by
# walking UP the directory tree looking for a pnpm-workspace.yaml. Without this
# file, any pnpm command run from inside ootk silently operates on the parent
# keeptrack-space project instead (which is how the parent's audit findings once
# looked like ootk's).
#
# Settings live here rather than in .npmrc so that plain npm/npx invocations
# don't warn "Unknown config" about pnpm-only keys.

# Match npm's lenient peer-dependency behavior so installs don't hard-fail on
# peer mismatches that npm previously tolerated.
strictPeerDependencies: false
autoInstallPeers: true
